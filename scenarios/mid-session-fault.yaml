metadata:
  version: "1.0"
  name: "Mid-Session Fault"
  description: "Inject a fault during an active charging session"
site:
  transformer_capacity_kw: 1000
  evses:
    - id: "1"
      max_power_kw: 350
      connector_type: "MCS"
events:
  arrivals:
    - tick: 10
      evse_id: "1"
      vehicle_id: "v1"
      requested_energy_kwh: 100
  power_requests: []
  faults:
    - tick: 60
      evse_id: "1"
      fault_type: "GroundFailure"
